[project]
name = "bajaninsider"
version = "0.1.0"
description = "Aggregates Barbados news from local outlets into one searchable feed, with an AI summary of the latest stories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.127.1",
    "google-genai>=1.56.0",
    "jinja2>=3.1.6",
    "motor>=3.7.1",
    "pydantic>=2.12.5",
    "pymongo>=4.15.5",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.21",
    "tenacity>=9.1.2",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "ruff", "pyright", "httpx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
