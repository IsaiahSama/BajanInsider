name: Scrape

# FastAPI Cloud has no scheduler, so the twice-daily scrape runs here.
# 09:00 and 20:00 UTC are 5am and 4pm AST (UTC-4, no daylight saving).
on:
  schedule:
    - cron: "0 9,20 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (version from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Scrape feeds
        run: uv run python -m app.services.scrape
