name: Scrape

# Not :00 — GitHub delays or drops scheduled runs under top-of-the-hour load.
on:
  schedule:
    - cron: "17 7,18 * * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URL: ${{ secrets.MONGODB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (version from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Scrape feeds
        run: uv run python -m app.services.scrape
